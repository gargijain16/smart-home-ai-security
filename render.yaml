# Optional Render blueprint for the backend (any Python host works). Run ONE worker: simulation state is in-process.
services:
  - type: web
    name: smart-home-ids-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: https://YOUR-APP.vercel.app
      - key: DB_PATH
        value: ":memory:"
      - key: MODELS_DIR
        value: ../models
      - key: REPORTS_DIR
        value: ../reports
      - key: PYTHON_VERSION
        value: "3.12.3"
